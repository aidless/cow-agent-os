# CI for cow-agent-os
#
# make check reruns every fortune-web-v2 test file and rereads the committed
# benchmark JSON. Counts live in README.md, which the check renders. They are
# not copied into this file. Failing tests stay visible because the README must
# match the run, including files that fail.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recompute the README figures
        run: make check

  mutation-control:
    # A suite that cannot fail is decoration. Break something real and require a
    # non-zero exit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fortune-web-v2/requirements.txt
      - name: Introduce a syntax error and require the gate to reject it
        shell: bash
        run: |
          set -euo pipefail
          cd fortune-web-v2
          cp auth_routes.py /tmp/auth_routes.py.bak
          printf '\ndef broken(:\n    pass\n' >> auth_routes.py
          if python -m compileall -q auth_routes.py >/dev/null 2>&1; then
            echo 'FAIL: compileall accepted a file with a syntax error'
            exit 1
          fi
          echo 'OK: the gate rejected the injected syntax error'