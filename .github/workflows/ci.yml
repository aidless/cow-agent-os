        # CI for cow-agent-os
        # This repository is mostly vendored. The workspace's own application lives in
# fortune-web-v2/ and is the only part with a runnable test suite, so that is what CI
# runs; the vendored trees under tools/ and knowledge/ are left untouched.
        # Generated by the enterprise-hardening pass (2026-10-04) against the repository's
        # actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fortune-web-v2/requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fortune-web-v2/requirements.txt
      - name: Run the application test suite
        run: |
          cd fortune-web-v2
          python -m pytest -q

  mutation-control:
    # A test suite that cannot fail is decoration. Break one route and require a failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fortune-web-v2/requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fortune-web-v2/requirements.txt
      - name: Remove one route handler and require the suite to fail
        run: |
          set -euo pipefail
          cd fortune-web-v2
          cp auth_routes.py /tmp/auth_routes.py.bak
          printf '\n# mutation control: the route table below is intentionally empty\nROUTES = {}\n' >> auth_routes.py
          if python -m pytest -q; then
            echo 'FAIL: the suite passed after a route handler was removed'
            exit 1
          fi
          echo 'OK: the suite detected the removed route handler'
